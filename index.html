<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche Rover ESP32 Web-Bluetooth</title>
    <link rel="icon" type="image/png" href="">
    <link rel="stylesheet" type="text/css" href="./PsycheRoverUI.css">
    
    <script type="module" src="./BluetoothConnection.js" defer></script>
    <script type="module" src="./PsycheRoverVLFControlsUI.js" defer></script>
    <script type="module" src="./PsycheRoverPIDataUI.js" defer></script>
    <script type="module" src="./PsycheRoverDriveControlsUI.js" defer></script>
</head>
<body>

    <!-- ================= VIEW 1: CONNECTION PAGE ================= -->
    <div id="connectionPageView" class="view">
        <h1>Psyche Rover ESP32 Web-Bluetooth Connection</h1>
        <button id="connectBleButton">Connect to BLE Device</button>
        <button id="disconnectBleButton">Disconnect BLE Device</button>
        <br><br>
        <button class="nav-btn" data-target="vlfControlsPageView">VLF Controls</button>
        <button class="nav-btn" data-target="piDisplayPageView">PI Data</button>
        <button class="nav-btn" data-target="driveControlsPageView">Rover Drive Controls</button>
        <p>BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
    </div>
  
    <!-- ================= VIEW 2: VLF CONTROLS ================= -->
    <div id="vlfControlsPageView" class="view" style="display: none;">
        <header>
            <h1>VLF Controls</h1>
            <button class="nav-btn" data-target="connectionPageView">Connection Page</button>
            <button class="nav-btn" data-target="piDisplayPageView">PI Data</button>
            <button class="nav-btn" data-target="driveControlsPageView">Rover Drive Controls</button>
        </header>
        <section class="controls">
            <div class="control-group">
                <div class="lableRow">
                    <h2>Duty Cycle</h2>
                    <div class="inputUnit">
                        <input type="number" id="dutyCycleInput" min="0" max="100" value="50">
                        <span>%</span>
                    </div>
                </div>
                <input type="range" id="dutyCycle" min="0" max="100" value="50">
            </div>
            
            <div class="control-group">
                <div class="lableRow">
                    <h2>Frequency</h2>
                    <div class="inputUnit">
                        <input type="number" id="freqInput" min="1000" max="10000" value="5270">
                        <span>Hz</span>
                    </div>
                </div>
                <input type="range" id="frequency" min="1000" max="10000" value="5270">
            </div>
            
            <div class="control-group">
                <div class="lableRow">
                    <h2>Resolution</h2>
                    <div class="inputUnit">
                        <input type="number" id="resolutionInput" min="10" max="13" value="12">
                    </div>
                </div>
                <input type="range" id="resolution" min="10" max="13" value="12">
            </div>
        </section>
    </div>
    
    <!-- ================= VIEW 3: PI DATA ================= -->
    <div id="piDisplayPageView" class="view" style="display: none;">
        <header>
            <h1>Pulse Induction Data</h1>
            <button class="nav-btn" data-target="connectionPageView">Connection Page</button>
            <button class="nav-btn" data-target="vlfControlsPageView">VLF Controls</button>
            <button class="nav-btn" data-target="driveControlsPageView">Rover Drive Controls</button>
        </header>
        <section>
            <canvas id="decayGraph" width="500" height="500" style="border: 1px solid #ccc;"></canvas>
            <p>Material Classification: <strong id="materialClass">Default</strong></p>
            <p>Tau: <strong id="tauValue">Default</strong></p>
        </section>
    </div>

    <!-- ================= VIEW 4: DRIVE CONTROLS ================= -->
    <div id="driveControlsPageView" class="view" style="display: none;">
        <header>
            <h1>Drive Controls</h1>
            <button class="nav-btn" data-target="connectionPageView">Connection Page</button>
            <button class="nav-btn" data-target="piDisplayPageView">PI Data</button>
            <button class="nav-btn" data-target="vlfControlsPageView">VLF Controls</button>
        </header>
    </div>

</body>
</html>
